[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --verbose
    --tb=short
norecursedirs = .git .pytest_cache *.egg mesh_heal_addon
minversion = 6.0
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, require setup)
    slow: marks tests as slow (may take several seconds)